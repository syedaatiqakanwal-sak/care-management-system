<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CPD Certificate</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Open Sans', sans-serif;
            background: #fff;
            -webkit-print-color-adjust: exact;
        }

        .certificate-container {
            width: 1123px;
            height: 794px;
            position: relative;
            overflow: hidden;
            background-image: url('data:image/jpeg;base64,{{BACKGROUND_IMAGE}}');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ===============================
           CENTER TEXT CONFIGURATION
        =============================== */

        #student-name {
            position: absolute;
            /* Moved UP to 325px to sit exactly between the top and bottom text lines */
            top: 325px;
            left: 0;
            right: 0;
            width: 100%;
            margin: 0 auto;

            text-align: center;
            font-size: 27pt;
            font-weight: 700;
            color: #000;

            /* Ensures long names don't touch edges */
            box-sizing: border-box;
            padding: 0 80px;
            line-height: 1.1;
        }

        #course-name {
            position: absolute;
            /* Maintained vertical position */
            top: 420px;
            left: 0;
            right: 0;
            width: 100%;
            margin: 0 auto;

            text-align: center;
            font-size: 27pt;
            font-weight: 700;
            color: #000;

            /* High Padding (220px) forces text to stay strictly in the center.
               This prevents it from touching the blue/red marker lines. */
            box-sizing: border-box;
            padding: 0 220px;
            line-height: 1.2;
            overflow-wrap: break-word;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-height: 110px;
        }

        #reg-no-layer {
            position: absolute;
            top: 122px;
            right: 95px;
            font-size: 12pt;
            font-weight: 600;
            color: #000;
            white-space: nowrap;
            text-align: center;
            width: 180px;
            letter-spacing: 0.5px;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ===============================
           ISSUE DATE (BOTTOM RIGHT)
           (UNTOUCHED)
        =============================== */
        #issue-date-layer {
            position: absolute;
            top: 553px;
            right: 200px;
            font-size: 13pt;
            font-weight: 600;
            color: #000;
            white-space: nowrap;
            text-align: right;
        }
    </style>
</head>

<body>
    <div class="certificate-container">

        <div id="reg-no-layer">{Reg_no}</div>
        <div id="issue-date-layer">{Date}</div>

        <div id="student-name">{Learner_Name}</div>
        <div id="course-name">{Course_Name}</div>

    </div>

    <script>
        (function() {
            var nameElement = document.getElementById('student-name');
            if (nameElement) {
                var rawName = nameElement.innerText.trim();
                if (rawName) {
                    nameElement.innerText = rawName
                        .toLowerCase()
                        .split(/\s+/)
                        .map(function(word) {
                            return word
                                .split('-')
                                .map(function(part) {
                                    return part.charAt(0).toUpperCase() + part.slice(1);
                                })
                                .join('-');
                        })
                        .join(' ');
                }
            }

            // 2. Auto-fit course name: if it exceeds 2 lines, reduce font size until it fits in 2 lines
            function fitCourseName() {
                var courseElement = document.getElementById('course-name');
                if (!courseElement) return;

                function getLineCount(target) {
                    var range = document.createRange();
                    range.selectNodeContents(target);
                    var rects = range.getClientRects();
                    var numRects = rects ? rects.length : 0;

                    var cs = window.getComputedStyle(target);
                    var lh = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize) * 1.2);
                    var heightLines = Math.round(target.scrollHeight / lh);
                    return Math.max(numRects, heightLines);
                }

                var currentPt = 27;
                var minPt = 12;

                while (getLineCount(courseElement) > 2 && currentPt > minPt) {
                    currentPt -= 0.5;
                    courseElement.style.fontSize = currentPt + 'pt';
                }
            }

            fitCourseName();
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function() {
                    fitCourseName();
                });
            }

            var dateElement = document.getElementById('issue-date-layer');
            if (dateElement) {
                // 1. Get the text injected by the server (e.g. "4 February 2026")
                var originalText = dateElement.innerText.trim();

                // 2. Parse it into a Date object
                var dateObj = new Date(originalText);

                // 3. Check if valid, then format
                if (!isNaN(dateObj.getTime())) {
                    var day = ("0" + dateObj.getDate()).slice(-2);
                    var month = ("0" + (dateObj.getMonth() + 1)).slice(-2);
                    var year = dateObj.getFullYear();
                    
                    // 4. Update the HTML element
                    dateElement.innerText = day + "/" + month + "/" + year;
                }
            }
        })();
    </script>
</body>

</html>
